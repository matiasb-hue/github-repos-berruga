<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registrar </title>
</head>

<body>

    <h2>Regristrar Usuario</h2>

    <p>Completa tus datos para registrarte</p>

    <form>

        <label>Nombre completo</label>
        <br>
        <input type="text" placeholder="Ingresa tu nombre completo" required>
        <br><br>

        <label>Usuario</label>
        <br>
        <input type="text" placeholder="Ingresa tu usuario" required>
        <br><br>

        <label>Correo electrónico</label>
        <br>
        <input type="email" placeholder="Ingresa tu correo electrónico" required>
        <br><br>

        <label>Contraseña</label>
        <br>
        <input type="password" placeholder="Ingresa tu contraseña" required>
        <br><br>

        <label>Confirmar contraseña</label>
        <br>
        <input type="password" placeholder="Confirma tu contraseña" required>
        <br><br>

        <button type="submit">Registrarse</button>

    </form>

    <p>
        ¿Ya tienes cuenta?
        <a href="login.html">Inicia sesión aquí</a>
    </p>

</body>

</html>
